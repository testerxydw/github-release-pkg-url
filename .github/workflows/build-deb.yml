# ============================================================================
# deb 构建与发布（公有 CI 仓库：testerxydw/github-release-pkg-url）
#
# 两个子项目共用本 workflow，按 tag 前缀分流：
#   - WorkBuddy CN  tag v*              → job: build（矩阵 x64/arm64）+ update-index + notify
#   - JoyCode       tag joycode-v*      → job: build-joycode（仅 amd64）+ update-index + notify
#
# 触发：本仓库 push tag（v* / joycode-v*）；或手动 workflow_dispatch
# 源码：从【私有仓库】testerxydw/workbuddy-linux 拉取（PRIVATE_REPO_PAT），
#       检出到 src/ 子目录；构建脚本在 src/ 内运行，产物 deb 落在 src/ 或 src/joycode-win-to-linux/dist/。
#       （脚本以自身所在目录 SCRIPT_DIR 定位安装包与产物，故安装包须放在脚本同级或上一级）
# 发布：deb 发布到【本仓库自身】对应 tag 的 Release（用 GITHUB_TOKEN）
# 收尾：update-index 按「# YYYY-MM-DD HH:MM <说明>」+ 链接 的约定格式，把本次 tag 的 deb 下载链接【追加】写入本仓库 github-release-pkg.txt（保留既有表头/注释/历史条目）
#
# ⚠️ 本仓库是公有仓库，运行日志与产物对公众可见：
#       - 只发布 deb（本就要公开发布）；切勿上传解包后的 app / 源码目录
#       - 不要给本 workflow 加 pull_request 触发（会把 PRIVATE_REPO_PAT 暴露给 fork PR）
# ============================================================================
name: build-deb

on:
  workflow_dispatch: {}
  push:
    tags: ['v*', 'joycode-v*']

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    # 仅 WorkBuddy 的 tag（v*）走本 job；JoyCode 的 tag 以 joycode- 开头，交给 build-joycode
    if: ${{ !startsWith(github.ref_name, 'joycode-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            debarch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            debarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出本仓库（取 latest-windows-exe.txt）
        uses: actions/checkout@v4

      - name: 拉取私有源码（testerxydw/workbuddy-linux）
        uses: actions/checkout@v4
        with:
          repository: testerxydw/workbuddy-linux
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: src

      - name: 安装 Node.js（编译 better-sqlite3 需要 npm）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync p7zip-full dpkg-dev python3 curl

      - name: 下载 Windows 安装包到 src/
        run: |
          URL="$(cat latest-windows-exe.txt | tr -d '[:space:]')"
          test -n "$URL" || { echo "缺少 latest-windows-exe.txt"; exit 1; }
          FNAME="$(basename "${URL%%\?*}")"
          echo "下载 Windows 安装包: $FNAME"
          curl -fL "$URL" -o "src/$FNAME"

      - name: 构建 (${{ matrix.arch }})
        run: cd src && bash build.sh --arch ${{ matrix.arch }} --no-install

      - name: 发布 deb 到本仓库 Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 仅发布 deb 主产物（不发布任何解包目录/源码）
          files: src/com.xydw.workbuddy_*_${{ matrix.debarch }}.deb
          fail_on_unmatched_files: false

  # ==========================================================================
  # JoyCode（京东云 JoyCode IDE）构建：tag joycode-v*
  #
  # 原理：JoyCode 3.0.10 = VS Code 1.98.2 fork + Electron 35.6.0，官方无 Linux 版；
  #       借 VS Code 1.102.0 linux-x64（同为 Electron 35.6.0，ABI 133）作 Linux 运行时与
  #       .so 原生模块来源，换掉 Windows 模块后重新打 deb。
  #       构建逻辑全部在私有仓库的 joycode-win-to-linux/build-joycode.sh 内，
  #       本 job 只负责准备缓存、下载安装包、执行构建。
  #
  # 依赖缓存（缺失时自动下载/编译，命中则秒过）：
  #   ~/.cache/bin/innoextract                  支持 Inno Setup 6.4 的解包器（源码编译，约 2 分钟）
  #   ~/.cache/vscode-runtime/*.tar.gz          VS Code 1.102.0 linux-x64 运行时（约 154MB）
  #   ~/.cache/native/                          better-sqlite3 / sqlite3 预编译 + msal Linux 二进制
  # ==========================================================================
  build-joycode:
    name: build-joycode
    if: ${{ startsWith(github.ref_name, 'joycode-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出本仓库（取 latest-joycode-exe.txt）
        uses: actions/checkout@v4

      - name: 拉取私有源码（testerxydw/workbuddy-linux）
        uses: actions/checkout@v4
        with:
          repository: testerxydw/workbuddy-linux
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: src

      - name: 安装系统依赖
        run: |
          sudo apt-get update -y
          # innoextract 需要 Boost（date_time/filesystem/iostreams/program_options/system），
          # 用 libboost-all-dev 一次装全，避免逐个组件找不齐导致 cmake 配置失败
          sudo apt-get install -y rsync dpkg-dev python3 curl ca-certificates \
            cmake g++ pkg-config libboost-all-dev zlib1g-dev liblzma-dev fakeroot icoutils aria2

      - name: 缓存构建依赖（innoextract / 运行时 / 原生模块）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bin/innoextract
            ~/.cache/vscode-runtime/vscode-1.102.0-linux-x64.tar.gz
            ~/.cache/native
          key: joycode-deps-v1-${{ runner.os }}

      - name: 准备 innoextract（支持 Inno Setup 6.4；系统自带 1.9 不支持）
        run: |
          set -e
          if [ -x "$HOME/.cache/bin/innoextract" ]; then
            "$HOME/.cache/bin/innoextract" --version | head -1
            echo "命中缓存，跳过编译"
            exit 0
          fi
          mkdir -p "$HOME/.cache/bin"
          git clone --depth 60 https://github.com/dscharrer/innoextract.git /tmp/innoextract-src
          cmake -S /tmp/innoextract-src -B /tmp/innoextract-build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/innoextract-build -j"$(nproc)"
          cp /tmp/innoextract-build/innoextract "$HOME/.cache/bin/innoextract"
          "$HOME/.cache/bin/innoextract" --version | head -1

      - name: 准备 VS Code 1.102.0 Linux 运行时（Electron 35.6.0）
        run: |
          set -e
          mkdir -p "$HOME/.cache/vscode-runtime"
          F="$HOME/.cache/vscode-runtime/vscode-1.102.0-linux-x64.tar.gz"
          if [ ! -s "$F" ]; then
            aria2c -x16 -s16 -k 1M --file-allocation=none \
              -d "$HOME/.cache/vscode-runtime" -o "$(basename "$F")" \
              "https://update.code.visualstudio.com/1.102.0/linux-x64/stable"
          fi
          ls -lh "$F"

      - name: 准备原生模块预编译包（better-sqlite3 / sqlite3 / msal）
        run: |
          set -e
          mkdir -p "$HOME/.cache/native/msal-linux-x64"
          cd "$HOME/.cache/native"
          [ -s better-sqlite3-v12.5.0-electron-v133-linux-x64.tar.gz ] || \
            curl -fL -o better-sqlite3-v12.5.0-electron-v133-linux-x64.tar.gz \
              "https://github.com/WiseLibs/better-sqlite3/releases/download/v12.5.0/better-sqlite3-v12.5.0-electron-v133-linux-x64.tar.gz"
          [ -s sqlite3-v5.1.7-napi-v6-linux-x64.tar.gz ] || \
            curl -fL -o sqlite3-v5.1.7-napi-v6-linux-x64.tar.gz \
              "https://github.com/TryGhost/node-sqlite3/releases/download/v5.1.7/sqlite3-v5.1.7-napi-v6-linux-x64.tar.gz"
          if [ ! -f msal-linux-x64/msal-node-runtime.node ]; then
            # 直接取 npm registry 的 tarball（不依赖本机 npm）
            curl -fL -o msal.tgz \
              "https://registry.npmjs.org/@azure/msal-node-runtime/-/msal-node-runtime-0.20.6.tgz"
            rm -rf msal-pkg && mkdir msal-pkg && tar -xzf msal.tgz -C msal-pkg
            cp msal-pkg/package/dist/linux/ubuntu/x64/msal-node-runtime.node msal-linux-x64/
            cp msal-pkg/package/dist/linux/ubuntu/x64/libmsalruntime.so      msal-linux-x64/
            rm -rf msal-pkg msal.tgz
          fi
          ls -lh . msal-linux-x64

      - name: 下载 JoyCode Windows 安装包到 src/
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -e
          SRC="$(grep -v '^[[:space:]]*#' latest-joycode-exe.txt | grep -m1 -E '^(https?://|release:)' || true)"
          test -n "$SRC" || { echo "latest-joycode-exe.txt 未配置安装包来源（见文件内注释）"; exit 1; }
          case "$SRC" in
            release:*)
              SPEC="${SRC#release:}"          # 形式: owner/repo@tag/asset
              REPO="${SPEC%%@*}"; REST="${SPEC#*@}"
              TAG="${REST%%/*}";  ASSET="${REST#*/}"
              echo "从私有仓库 Release 下载: $REPO @ $TAG / $ASSET"
              gh release download "$TAG" -R "$REPO" -p "$ASSET" -O "src/JoyCodeSetup.exe" --clobber
              ;;
            *)
              echo "从直链下载: $SRC"
              curl -fL --retry 3 "$SRC" -o "src/JoyCodeSetup.exe"
              ;;
          esac
          ls -lh src/JoyCodeSetup.exe

      - name: 构建 JoyCode deb
        run: cd src && bash joycode-win-to-linux/build-joycode.sh --no-install

      - name: 发布 deb 到本仓库 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src/joycode-win-to-linux/dist/joycode_*_amd64.deb
          fail_on_unmatched_files: false

  # 收尾：把本次 tag 的 deb 下载链接【追加】写入本仓库根的 github-release-pkg.txt（保留表头/注释/历史条目，新条目带发布时间 + 说明）
  update-index:
    name: update github-release-pkg.txt
    needs: [build, build-joycode]
    # 两个构建 job 按 tag 前缀二选一执行（另一个为 skipped），故用 always() + 结果判定
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && (needs.build.result == 'success' || needs.build-joycode.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: 追加 deb 下载链接（带发布时间 + 说明）到 github-release-pkg.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: testerxydw
          REPO: github-release-pkg-url
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          API="https://api.github.com/repos/$OWNER/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"
          # 本次 tag 的 Release 资产（已含 build 矩阵各架构上传的 deb）
          REL=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG")
          # 读取【现有】索引内容（必须！否则下面的 EXISTING 为空 → BODY 直接覆盖整份索引、丢失历史条目）
          EXISTING=$(curl -s -H "$AUTH" "$API/contents/github-release-pkg.txt" | python3 -c '
          import sys, json, base64
          try:
              d = json.load(sys.stdin)
              print(base64.b64decode(d.get("content", "")).decode("utf-8"), end="")
          except Exception:
              pass')
          if [ -z "$EXISTING" ]; then
            echo "索引文件为空或不存在，本次按首次写入处理"
          else
            echo "已取到现有索引：$(printf '%s' "$EXISTING" | grep -c '^http') 条下载链接"
          fi
          # 仅追加本次 tag「索引尚未包含」的 deb：# 发布时间 <说明> + 下载链接
          export EXISTING_CONTENT="$EXISTING"
          APPEND=$(echo "$REL" | python3 -c '
          import sys, json, re, os
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          existing = os.environ.get("EXISTING_CONTENT", "")
          existing_urls = {l.strip() for l in existing.splitlines() if l.strip().startswith("http")}
          NAME_MAP = {
              "workbuddy": "WorkBuddy CN",
              "trae-solo-cn": "Trae SOLO 国内版",
              "com.navicat.premiumlite": "Navicat Premium Lite",
              "joycode": "JoyCode",
          }
          out = []
          for a in d.get("assets", []):
              name = a.get("name", "")
              if not name.endswith(".deb"):
                  continue
              url = a.get("browser_download_url", "")
              if url in existing_urls:
                  continue
              m = re.match(r"^(?:com\.xydw\.)?(.+?)_([^_]+)_([^_]+)\.deb$", name)
              pkg = ver = arch = ""
              if m:
                  pkg, ver, arch = m.group(1), m.group(2), m.group(3)
              else:
                  pkg = name
              disp = NAME_MAP.get(pkg, pkg)
              desc = disp + (f" {ver}" if ver else "") + (f" ({arch})" if arch else "")
              created = (a.get("created_at", "") or "")[:16].replace("T", " ")
              out.append(f"# {created} {desc}")
              out.append(url)
          print("\n".join(out))
          ')
          if [ -z "$APPEND" ]; then
            echo "索引已包含本次 tag 的全部 deb 资产，跳过写入"
            exit 0
          fi
          # 现有内容去尾随空行后追加新条目（最新在末尾，符合增量约定）；首建则无表头
          if [ -z "$EXISTING" ]; then
            BODY="$APPEND"
          else
            BODY=$(printf "%s\n%s\n" "$(printf "%s" "$EXISTING" | sed -e 's/[[:space:]]*$//')" "$APPEND")
          fi
          CONTENT=$(printf "%s\n" "$BODY" | base64 -w0)
          echo "本次向 github-release-pkg.txt 追加："
          echo "$APPEND"
          # 取现有文件 SHA（不存在则为空字符串）
          SHA=$(curl -s -H "$AUTH" "$API/contents/github-release-pkg.txt" \
                | python3 -c 'import sys,json
          try:
              print(json.load(sys.stdin).get("sha",""))
          except Exception:
              print("")')
          if [ -n "$SHA" ]; then
            curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" \
              "$API/contents/github-release-pkg.txt" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'message':'chore: update deb download links ($TAG)','content':'$CONTENT','sha':'$SHA'}))")"
          else
            curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" \
              "$API/contents/github-release-pkg.txt" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'message':'chore: update deb download links ($TAG)','content':'$CONTENT'}))")"
          fi
          echo "github-release-pkg.txt 已更新（本仓库 $OWNER/$REPO）"

  # 收尾：发布完成后多通道通知（构建失败也会通知，便于及时排查）
  # 配置：仓库 Settings → Secrets and variables → Actions，新增任意一个或多个；未配置的通道自动跳过
  #   WECOM_WEBHOOK    企业微信群机器人完整 webhook 地址（推荐）
  #                    机器人若设置了「自定义关键词」，默认填「发布通知」（本通知标题已含该词）
  #   PUSHPLUS_TOKEN   PushPlus token（推送到微信；pushplus.plus 微信扫码登录后获取）
  #   SERVERCHAN_KEY   Server 酱 SendKey（推送到微信；sct.ftqq.com 获取）
  #   TG_BOT_TOKEN + TG_CHAT_ID   Telegram 机器人推送
  #   NTFY_TOPIC       ntfy 主题名或完整 URL（手机装 ntfy App 订阅该主题）
  #   BARK_URL         Bark 推送地址（iOS）
  #   MAIL_*           邮件推送（Python smtplib 直发，零依赖第三方 action）：
  #                     MAIL_SMTP_HOST   SMTP 服务器，如 smtp.qq.com / smtp.163.com / smtp.gmail.com
  #                     MAIL_SMTP_PORT   465（SSL，默认）或 587（STARTTLS）
  #                     MAIL_USERNAME    发件邮箱
  #                     MAIL_PASSWORD    SMTP 授权码（多数邮箱不是登录密码）
  #                     MAIL_TO          收件人，多个用逗号分隔
  #                     MAIL_FROM        可选，默认 = MAIL_USERNAME
  # 说明：本仓库是公有仓库，通知密钥一律存 Secrets（日志中自动 mask），切勿写进本文件。
  notify:
    name: notify
    needs: [build, build-joycode, update-index]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: 生成通知内容（Markdown）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_JC_RESULT: ${{ needs.build-joycode.result }}
          INDEX_RESULT: ${{ needs.update-index.result }}
        run: |
          set -uo pipefail
          echo '{}' > rel.json
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" -o rel.json || true
          python3 -c '
          import json, os, re, html
          from datetime import datetime, timedelta, timezone

          tag = os.environ["TAG"]; repo = os.environ["REPO"]
          index = os.environ["INDEX_RESULT"]
          # tag 前缀区分产品：joycode-v* → JoyCode，其余 → WorkBuddy
          is_jc = tag.startswith("joycode-")
          product = "JoyCode" if is_jc else "WorkBuddy"
          build = os.environ.get("BUILD_JC_RESULT", "") if is_jc else os.environ.get("BUILD_RESULT", "")
          ts = (datetime.now(timezone.utc) + timedelta(hours=8)).strftime("%Y-%m-%d %H:%M")
          try:
              rel = json.load(open("rel.json", encoding="utf-8"))
              rel = rel if isinstance(rel, dict) else {}
          except Exception:
              rel = {}
          ok = build == "success"
          lines = ["## 发布通知 · %s Linux 包" % product + ("发布成功 ✅" if ok else "构建失败 ❌"), ""]
          lines.append("> 版本：**%s**" % tag)
          lines.append("> 时间：%s (UTC+8)" % ts)
          lines.append("> 仓库：%s" % repo)
          if not ok:
              lines.append("> 构建结果：%s　索引：%s" % (build, index))
          url = rel.get("html_url") or ("https://github.com/%s/releases/tag/%s" % (repo, tag))
          debs = sorted([a for a in rel.get("assets", []) if str(a.get("name", "")).endswith(".deb")],
                        key=lambda a: a.get("name", ""))
          lines.append("")
          lines.append("**下载**：[%s](%s)" % (tag, url))
          for a in debs:
              lines.append("- [%s](%s)" % (a.get("name"), a.get("browser_download_url")))
          md = "\n".join(lines) + "\n"
          open("notice.md", "w", encoding="utf-8").write(md)
          open("notice.txt", "w", encoding="utf-8").write(
              "\n".join(l.replace("**", "").replace("## ", "").replace("> ", "") for l in lines) + "\n")

          # 邮件用的 HTML 版正文（极简 Markdown 渲染：标题/引用/链接/列表）
          def inline(s):
              s = html.escape(s)
              s = re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", s)
              return re.sub(r"\[(.+?)\]\((https?://[^)]+)\)", "<a href=\"\\2\">\\1</a>", s)

          body, in_ul = [], False
          for l in lines:
              if l.startswith("## "):
                  body.append("<h2 style=\"margin:0 0 12px\">%s</h2>" % inline(l[3:]))
              elif l.startswith("> "):
                  body.append("<p style=\"color:#666;margin:2px 0\">%s</p>" % inline(l[2:]))
              elif l.startswith("- "):
                  if not in_ul:
                      body.append("<ul style=\"margin:6px 0\">"); in_ul = True
                  body.append("<li>%s</li>" % inline(l[2:]))
              elif not l.strip() and in_ul:
                  body.append("</ul>"); in_ul = False
          if in_ul:
              body.append("</ul>")
          open("notice.html", "w", encoding="utf-8").write(
              "<html><body style=\"font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;"
              "font-size:14px;color:#222;line-height:1.6\">\n" + "\n".join(body) + "\n</body></html>\n")
          print(md)
          '
          cat notice.md >> "$GITHUB_STEP_SUMMARY"

      - name: 发送通知（未配置的通道自动跳过）
        env:
          TITLE: ${{ startsWith(github.ref_name, 'joycode-') && 'JoyCode Linux 发布通知' || 'WorkBuddy Linux 发布通知' }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BARK_URL: ${{ secrets.BARK_URL }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          SENT=0

          # 1) 企业微信群机器人（msgtype=markdown）
          if [ -n "${WECOM_WEBHOOK:-}" ]; then
            python3 -c '
          import json
          print(json.dumps({"msgtype": "markdown",
                            "markdown": {"content": open("notice.md", encoding="utf-8").read()}},
                           ensure_ascii=False))
          ' > /tmp/wecom.json
            echo "企业微信机器人返回: $(curl -s --max-time 20 -X POST \
              -H 'Content-Type: application/json' --data-binary @/tmp/wecom.json "$WECOM_WEBHOOK")"
            SENT=$((SENT + 1))
          fi

          # 2) PushPlus（微信公众号推送）
          if [ -n "${PUSHPLUS_TOKEN:-}" ]; then
            python3 -c '
          import json, os
          print(json.dumps({"token": os.environ["PUSHPLUS_TOKEN"], "title": os.environ["TITLE"],
                            "content": open("notice.md", encoding="utf-8").read(), "template": "markdown"},
                           ensure_ascii=False))
          ' > /tmp/pushplus.json
            echo "PushPlus 返回: $(curl -s --max-time 20 -X POST -H 'Content-Type: application/json' \
              --data-binary @/tmp/pushplus.json https://www.pushplus.plus/send)"
            SENT=$((SENT + 1))
          fi

          # 3) Server 酱（微信公众号推送）
          if [ -n "${SERVERCHAN_KEY:-}" ]; then
            echo "Server酱返回: $(curl -s --max-time 20 -X POST \
              "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
              --data-urlencode "title=${TITLE}" --data-urlencode "desp@notice.md")"
            SENT=$((SENT + 1))
          fi

          # 4) Telegram Bot
          if [ -n "${TG_BOT_TOKEN:-}" ] && [ -n "${TG_CHAT_ID:-}" ]; then
            echo "Telegram 返回: $(curl -s --max-time 20 -X POST \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text@notice.txt" \
              -d "disable_web_page_preview=true")"
            SENT=$((SENT + 1))
          fi

          # 5) ntfy（手机装 ntfy App 订阅）
          if [ -n "${NTFY_TOPIC:-}" ]; then
            NTFY_URL="$NTFY_TOPIC"
            case "$NTFY_URL" in http*) ;; *) NTFY_URL="https://ntfy.sh/${NTFY_TOPIC}" ;; esac
            echo "ntfy 返回: $(curl -s --max-time 20 -X POST -H "Title: ${TITLE}" \
              -H 'Markdown: yes' --data-binary @notice.md "$NTFY_URL")"
            SENT=$((SENT + 1))
          fi

          # 6) Bark（iOS）
          if [ -n "${BARK_URL:-}" ]; then
            python3 -c '
          import json, os
          print(json.dumps({"title": os.environ["TITLE"],
                            "body": open("notice.txt", encoding="utf-8").read()}, ensure_ascii=False))
          ' > /tmp/bark.json
            echo "Bark 返回: $(curl -s --max-time 20 -X POST -H 'Content-Type: application/json' \
              --data-binary @/tmp/bark.json "$BARK_URL")"
            SENT=$((SENT + 1))
          fi

          # 7) 邮件（Python smtplib 直发；465=SSL，其它端口走 STARTTLS）
          if [ -n "${MAIL_SMTP_HOST:-}" ] && [ -n "${MAIL_USERNAME:-}" ] && \
             [ -n "${MAIL_PASSWORD:-}" ] && [ -n "${MAIL_TO:-}" ]; then
            if python3 -c '
          import os, ssl, smtplib
          from email.message import EmailMessage
          from email.utils import formatdate

          host = os.environ["MAIL_SMTP_HOST"]
          port = int(os.environ.get("MAIL_SMTP_PORT") or 465)
          user = os.environ["MAIL_USERNAME"]
          pwd = os.environ["MAIL_PASSWORD"]
          to = [x.strip() for x in os.environ["MAIL_TO"].replace(";", ",").split(",") if x.strip()]
          frm = os.environ.get("MAIL_FROM") or user
          subject = os.environ.get("TITLE", "发布通知")
          if os.environ.get("TAG"):
              subject += " · " + os.environ["TAG"]

          msg = EmailMessage()
          msg["From"] = frm
          msg["To"] = ", ".join(to)
          msg["Subject"] = subject
          msg["Date"] = formatdate(localtime=True)
          msg.set_content(open("notice.txt", encoding="utf-8").read())
          msg.add_alternative(open("notice.html", encoding="utf-8").read(), subtype="html")

          if port == 465:
              srv = smtplib.SMTP_SSL(host, port, timeout=30, context=ssl.create_default_context())
          else:
              srv = smtplib.SMTP(host, port, timeout=30)
              srv.ehlo()
              try:
                  srv.starttls(context=ssl.create_default_context())
                  srv.ehlo()
              except smtplib.SMTPException:
                  pass
          srv.login(user, pwd)
          srv.send_message(msg)
          srv.quit()
          print("邮件已发送至: " + ", ".join(to))
          '; then
              SENT=$((SENT + 1))
            else
              echo "邮件发送失败：请检查 MAIL_SMTP_HOST/PORT/USERNAME/PASSWORD（授权码）/MAIL_TO 配置。"
            fi
          fi

          if [ "$SENT" -eq 0 ]; then
            echo "未配置任何通知通道（可配置 WECOM_WEBHOOK / PUSHPLUS_TOKEN / SERVERCHAN_KEY / TG_BOT_TOKEN+TG_CHAT_ID / NTFY_TOPIC / BARK_URL / MAIL_*），本次未发送通知。"
          else
            echo "已向 $SENT 个通知通道发送发布通知。"
          fi
